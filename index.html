<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rocket Lab</title>
  <meta name="description" content="An adaptive curiosity app for math/science, writing, code, and trivia. No grading, just leveling up." />
  <meta name="theme-color" content="#0a0a0f" />
  <script>
    // Applied before the stylesheet paints anything, so switching to the
    // light theme never flashes dark first.
    document.documentElement.dataset.theme = localStorage.getItem("dq:theme") || "dark";
  </script>
  <!-- iOS Safari doesn't reliably read name/display-mode from the web
       manifest the way Android does — these make "Rocket Lab" and the
       no-browser-chrome standalone launch consistent across iOS versions. -->
  <meta name="apple-mobile-web-app-title" content="Rocket Lab" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/mascot.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- Profile picker -->
    <section id="screen-profiles" class="screen" data-screen="profiles">
      <div id="lang-picker" class="lang-picker"></div>
      <header class="brand">
        <img src="icons/mascot.svg" alt="" class="brand-mascot" />
        <h1>Rocket Lab</h1>
        <p id="brand-tagline" class="brand-tagline" data-i18n="brand.tagline"></p>
      </header>
      <div id="profile-list" class="profile-list"></div>

      <div id="onboarding" class="onboarding hidden">
        <div id="onboarding-dots" class="onboarding-dots"></div>

        <div class="onboarding-step" data-step="identity">
          <label for="new-profile-name" data-i18n="onboarding.name_label"></label>
          <input id="new-profile-name" maxlength="24" data-i18n-placeholder="onboarding.name_placeholder" autocomplete="off" />
          <div id="emoji-picker" class="emoji-picker"></div>
        </div>

        <div class="onboarding-step hidden" data-step="age">
          <label for="onboarding-age" data-i18n="onboarding.age_label"></label>
          <input id="onboarding-age" type="number" inputmode="numeric" min="10" max="19" data-i18n-placeholder="onboarding.age_placeholder" />
          <p class="focus-hint" data-i18n="onboarding.age_hint"></p>
        </div>

        <div class="onboarding-step hidden" data-step="difficulty">
          <label data-i18n="onboarding.difficulty_label"></label>
          <div id="difficulty-choice" class="choice-row">
            <button type="button" class="choice-btn-lg" data-value="1"><span data-i18n="difficulty.easy.title"></span><span data-i18n="difficulty.easy.sub"></span></button>
            <button type="button" class="choice-btn-lg" data-value="2"><span data-i18n="difficulty.medium.title"></span><span data-i18n="difficulty.medium.sub"></span></button>
            <button type="button" class="choice-btn-lg" data-value="3"><span data-i18n="difficulty.hard.title"></span><span data-i18n="difficulty.hard.sub"></span></button>
          </div>
        </div>

        <div class="onboarding-step hidden" data-step="interests">
          <label data-i18n="onboarding.interests_label"></label>
          <div id="interests-choice" class="choice-row"></div>
          <p class="focus-hint" data-i18n="onboarding.interests_hint"></p>
        </div>

        <div class="onboarding-step hidden" data-step="goal">
          <label data-i18n="onboarding.goal_label"></label>
          <div id="goal-choice" class="choice-row">
            <button type="button" class="choice-btn-lg" data-type="count" data-value="10"><span data-i18n="goal.count10.title"></span><span data-i18n="goal.count10.sub"></span></button>
            <button type="button" class="choice-btn-lg" data-type="count" data-value="20"><span data-i18n="goal.count20.title"></span><span data-i18n="goal.count20.sub"></span></button>
            <button type="button" class="choice-btn-lg" data-type="time" data-value="5"><span data-i18n="goal.time5.title"></span><span data-i18n="goal.time5.sub"></span></button>
            <button type="button" class="choice-btn-lg" data-type="time" data-value="10"><span data-i18n="goal.time10.title"></span><span data-i18n="goal.time10.sub"></span></button>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="onboarding-back" class="btn btn-ghost" data-i18n="btn.cancel"></button>
          <button type="button" id="onboarding-next" class="btn btn-primary" data-i18n="btn.next"></button>
        </div>
      </div>
    </section>

    <!-- Main quest loop -->
    <section id="screen-quest" class="screen hidden" data-screen="quest">
      <header class="quest-header">
        <button id="switch-profile" class="btn btn-ghost btn-small" data-i18n-title="btn.switch_profile_title">⇄</button>
        <div id="active-profile-tag" class="active-profile-tag"></div>
        <div class="quest-header-actions">
          <button id="toggle-sound" class="btn btn-ghost btn-small" data-i18n-title="btn.sound_title">🔊</button>
          <div class="lang-toggle-wrap">
            <button id="toggle-lang" class="btn btn-ghost btn-small" data-i18n-title="btn.language_title">🌐</button>
            <div id="lang-picker-quest" class="lang-picker lang-picker-popover hidden"></div>
          </div>
          <button id="open-focus" class="btn btn-ghost btn-small" data-i18n="btn.focus" data-i18n-title="btn.focus_title"></button>
          <button id="open-rocket" class="btn btn-ghost btn-small" data-i18n-title="btn.rocket_title">🚀</button>
          <button id="open-dashboard" class="btn btn-ghost btn-small" data-i18n="btn.stats"></button>
        </div>
      </header>

      <div class="pill-row">
        <button id="goal-pill" class="goal-pill" data-i18n-title="goal_pill.title"></button>
        <div id="streak-pill" class="streak-pill"></div>
      </div>

      <div id="domain-badge" class="domain-badge"></div>

      <div id="quest-card" class="quest-card">
        <p id="quest-prompt" class="quest-prompt"></p>
        <div id="quest-choices" class="quest-choices"></div>
        <div id="quest-freeresponse" class="quest-freeresponse hidden">
          <textarea id="freeresponse-input" rows="4" data-i18n-placeholder="quest.freeresponse_placeholder"></textarea>
          <div id="wordcount" class="wordcount"></div>
          <button id="submit-freeresponse" class="btn btn-primary" data-i18n="btn.submit"></button>
        </div>
        <div id="enjoyment-picker" class="enjoyment-picker hidden">
          <p data-i18n="quest.how_was_that"></p>
          <div class="enjoyment-options">
            <button class="btn enjoyment-btn" data-value="1">🥱</button>
            <button class="btn enjoyment-btn" data-value="2">🙂</button>
            <button class="btn enjoyment-btn" data-value="3">😃</button>
            <button class="btn enjoyment-btn" data-value="4">🔥</button>
          </div>
        </div>
        <div id="quest-feedback" class="quest-feedback hidden"></div>
      </div>

      <div class="quest-footer">
        <button id="next-prompt" class="btn btn-primary hidden" data-i18n="btn.next"></button>
        <button id="skip-prompt" class="btn btn-ghost btn-small" data-i18n="btn.skip"></button>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="screen-dashboard" class="screen hidden" data-screen="dashboard">
      <header class="dashboard-header">
        <button id="close-dashboard" class="btn btn-ghost btn-small" data-i18n="btn.back"></button>
        <h2 id="dashboard-title"></h2>
      </header>
      <div id="dashboard-content" class="dashboard-content"></div>
    </section>

    <!-- Focus: what to drill into -->
    <section id="screen-focus" class="screen hidden" data-screen="focus">
      <header class="dashboard-header">
        <button id="close-focus" class="btn btn-ghost btn-small"></button>
        <h2 data-i18n="focus.title"></h2>
      </header>

      <div class="focus-content">
        <p id="focus-intro" class="focus-intro-hint hidden" data-i18n="focus.first_run_hint"></p>

        <div class="focus-block">
          <div class="focus-block-title" data-i18n="focus.theme_label"></div>
          <div id="theme-toggle" class="breadth-toggle">
            <button class="breadth-option" data-theme="dark"><span data-i18n="focus.theme_dark"></span><span data-i18n="focus.theme_dark_sub"></span></button>
            <button class="breadth-option" data-theme="light"><span data-i18n="focus.theme_light"></span><span data-i18n="focus.theme_light_sub"></span></button>
          </div>
        </div>

        <div class="focus-block">
          <div class="focus-block-title" data-i18n="focus.difficulty_label"></div>
          <p class="focus-hint" data-i18n="focus.difficulty_hint"></p>
          <div id="difficulty-reset-choice" class="choice-row">
            <button type="button" class="choice-btn-lg" data-value="1"><span data-i18n="difficulty.easy.title"></span><span data-i18n="difficulty.easy.sub"></span></button>
            <button type="button" class="choice-btn-lg" data-value="2"><span data-i18n="difficulty.medium.title"></span><span data-i18n="difficulty.medium.sub"></span></button>
            <button type="button" class="choice-btn-lg" data-value="3"><span data-i18n="difficulty.hard.title"></span><span data-i18n="difficulty.hard.sub"></span></button>
          </div>
          <p id="difficulty-reset-status" class="focus-hint hidden"></p>
        </div>

        <div class="focus-block">
          <div class="focus-block-title" data-i18n="focus.reminder_label"></div>
          <p class="focus-hint" data-i18n="focus.reminder_hint"></p>
          <div class="reminder-row">
            <input id="reminder-time" type="time" value="18:00" />
            <button id="reminder-toggle" type="button" class="btn btn-primary btn-small"></button>
          </div>
          <p id="reminder-status" class="focus-hint"></p>
        </div>

        <div class="focus-block">
          <div class="focus-block-title" data-i18n="focus.subjects_label"></div>
          <p class="focus-hint" data-i18n="focus.subjects_hint"></p>
          <div id="focus-domains" class="chip-row"></div>
        </div>

        <div class="focus-block">
          <div class="focus-block-title" data-i18n="focus.style_mix_label"></div>
          <p class="focus-hint" data-i18n="focus.style_mix_hint"></p>
          <div id="style-mix-choice" class="chip-row">
            <button type="button" class="chip" data-value="0" data-i18n="focus.style_mix_quiz"></button>
            <button type="button" class="chip" data-value="25" data-i18n="focus.style_mix_mostly_quiz"></button>
            <button type="button" class="chip" data-value="50" data-i18n="focus.style_mix_balanced"></button>
            <button type="button" class="chip" data-value="75" data-i18n="focus.style_mix_mostly_writing"></button>
          </div>
        </div>

        <div class="focus-block">
          <div class="focus-block-title" data-i18n="focus.range_label"></div>
          <div id="breadth-toggle" class="breadth-toggle">
            <button class="breadth-option" data-breadth="broad"><span data-i18n="focus.broad_title"></span><span data-i18n="focus.broad_sub"></span></button>
            <button class="breadth-option" data-breadth="narrow"><span data-i18n="focus.narrow_title"></span><span data-i18n="focus.narrow_sub"></span></button>
          </div>
        </div>

        <div id="focus-topics" class="focus-block"></div>

        <div id="focus-regions-block" class="focus-block">
          <div class="focus-block-title" data-i18n="focus.regions_title"></div>
          <div id="focus-regions" class="chip-row"></div>
        </div>

        <div class="focus-block">
          <div class="focus-block-title" data-i18n="focus.write_subject_title"></div>
          <p class="focus-hint" data-i18n="focus.write_subject_hint"></p>
          <form id="subject-request-form" class="subject-request-form">
            <select id="subject-domain" aria-label="Domain"></select>
            <input id="subject-text" maxlength="80" data-i18n-placeholder="focus.write_subject_placeholder" autocomplete="off" />
            <button type="submit" class="btn btn-primary btn-small" data-i18n="btn.add"></button>
          </form>
          <div id="subject-requests-list" class="subject-requests-list"></div>
        </div>

        <button id="focus-start-bottom" class="btn btn-primary focus-start-cta hidden" data-i18n="btn.start_quest"></button>
      </div>
    </section>

    <!-- Rocket Science: fixed 3-stage curriculum, not the adaptive engine -->
    <section id="screen-rocket" class="screen hidden" data-screen="rocket">
      <header class="dashboard-header">
        <button id="close-rocket" class="btn btn-ghost btn-small" data-i18n="btn.back"></button>
        <h2 data-i18n="rocket.title"></h2>
      </header>

      <div class="rocket-content">
        <div class="rocket-illustration">
          <svg viewBox="0 0 120 240" class="rocket-svg" aria-hidden="true">
            <g id="rocket-part-capsule" class="rocket-part">
              <path class="rocket-capsule-body" d="M35,58 Q35,10 60,8 Q85,10 85,58 Z" />
              <circle class="rocket-capsule-window" cx="60" cy="42" r="8" />
            </g>
            <g id="rocket-part-body" class="rocket-part">
              <rect class="rocket-tank-body" x="32" y="58" width="56" height="95" rx="10" />
              <rect class="rocket-tank-stripe" x="32" y="98" width="56" height="8" />
            </g>
            <g id="rocket-part-booster" class="rocket-part">
              <polygon class="rocket-booster-fin" points="36,178 12,218 36,206" />
              <polygon class="rocket-booster-fin" points="84,178 108,218 84,206" />
              <rect class="rocket-booster-body" x="36" y="153" width="48" height="45" rx="6" />
              <polygon class="rocket-flame" points="48,198 60,232 72,198" />
            </g>
          </svg>
        </div>

        <div id="rocket-stage-list-view">
          <p class="rocket-intro" data-i18n="rocket.intro"></p>
          <div id="rocket-stage-cards" class="rocket-stage-cards"></div>
        </div>

        <div id="rocket-play-view" class="hidden">
          <div class="rocket-play-header">
            <button id="rocket-back-to-stages" class="btn btn-ghost btn-small" data-i18n="rocket.back_to_stages"></button>
            <div id="rocket-progress" class="rocket-progress"></div>
          </div>
          <div id="rocket-card" class="quest-card">
            <p id="rocket-prompt" class="quest-prompt"></p>
            <div id="rocket-choices" class="quest-choices"></div>
            <div id="rocket-freeresponse" class="quest-freeresponse hidden">
              <textarea id="rocket-freeresponse-input" rows="4" data-i18n-placeholder="quest.freeresponse_placeholder"></textarea>
              <div id="rocket-wordcount" class="wordcount"></div>
              <button id="rocket-submit-freeresponse" class="btn btn-primary" data-i18n="btn.submit"></button>
            </div>
            <div id="rocket-feedback" class="quest-feedback hidden"></div>
          </div>
          <button id="rocket-next" class="btn btn-primary hidden" data-i18n="btn.next"></button>
        </div>

        <div id="rocket-mission-complete-view" class="hidden">
          <h3 data-i18n="rocket.mission_complete_title"></h3>
          <p data-i18n="rocket.mission_complete_body"></p>
          <button id="rocket-mission-done" class="btn btn-primary" data-i18n="rocket.back_to_stages"></button>
        </div>
      </div>
    </section>

    <!-- Overlays: achievement toast, goal-complete celebration, goal picker -->
    <div id="achievement-toast" class="achievement-toast hidden"></div>

    <div id="goal-complete-overlay" class="overlay hidden">
      <div class="overlay-card">
        <img src="icons/mascot.svg" alt="" class="overlay-mascot" />
        <h3 id="goal-complete-title" data-i18n="goal_complete.title"></h3>
        <p id="goal-complete-body" class="overlay-body"></p>
        <button id="goal-complete-dismiss" class="btn btn-primary" data-i18n="btn.keep_going"></button>
      </div>
    </div>

    <div id="goal-picker-overlay" class="overlay hidden">
      <div class="overlay-card">
        <h3 data-i18n="onboarding.goal_label"></h3>
        <div id="goal-picker-choice" class="choice-row">
          <button type="button" class="choice-btn-lg" data-type="count" data-value="10"><span data-i18n="goal.count10.title"></span><span data-i18n="goal.count10.sub"></span></button>
          <button type="button" class="choice-btn-lg" data-type="count" data-value="20"><span data-i18n="goal.count20.title"></span><span data-i18n="goal.count20.sub"></span></button>
          <button type="button" class="choice-btn-lg" data-type="time" data-value="5"><span data-i18n="goal.time5.title"></span><span data-i18n="goal.time5.sub"></span></button>
          <button type="button" class="choice-btn-lg" data-type="time" data-value="10"><span data-i18n="goal.time10.title"></span><span data-i18n="goal.time10.sub"></span></button>
        </div>
        <button id="goal-picker-close" class="btn btn-ghost" data-i18n="btn.close"></button>
      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/rocket.js"></script>
  <script src="js/questions-i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/grading.js"></script>
  <script src="js/push.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
