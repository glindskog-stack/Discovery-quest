<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rocket Lab mascot: a cream labrador with pixel sunglasses, a bandana, and its tongue out">

  <!-- everything tilts together for a cocky, jaunty pose; no background fill -->
  <g transform="rotate(-6 256 294)">

    <!-- bandana: peeking out from behind the jaw -->
    <path d="M 312 400 L 348 411 L 308 432 Z" fill="#D4FF00" stroke="#0A0A0F" stroke-width="4" stroke-linejoin="round" />
    <circle cx="312" cy="400" r="5" fill="#0A0A0F" opacity="0.85" />

    <!-- ears (behind head) — deepened a shade for silhouette contrast, hugging the slim head -->
    <ellipse cx="158" cy="264" rx="44" ry="112" fill="#E5CE9C" transform="rotate(-18 158 264)" />
    <ellipse cx="354" cy="264" rx="44" ry="112" fill="#E5CE9C" transform="rotate(18 354 264)" />

    <!-- fur tuft: spiky cowlick, drawn under the head so only the tips poke out -->
    <path d="M 264 176 L 273 124 L 282 178 Z" fill="#E4C98A" />
    <path d="M 279 180 L 291 100 L 302 180 Z" fill="#E4C98A" />
    <path d="M 296 178 L 307 128 L 316 176 Z" fill="#E4C98A" />

    <!-- head: slim oval, not round -->
    <ellipse cx="256" cy="294" rx="108" ry="150" fill="#F7ECD6" />

    <!-- brow: peeking above the shades for a bit of attitude -->
    <path d="M 194 236 Q 210 222 226 234" stroke="#E4D3AC" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M 286 234 Q 302 222 318 236" stroke="#E4D3AC" stroke-width="7" fill="none" stroke-linecap="round" />

    <!-- sunglasses: pixel / "deal with it" meme style, 8-bit block lenses -->
    <line x1="176" y1="250" x2="154" y2="240" stroke="#14171C" stroke-width="9" stroke-linecap="round" />
    <line x1="336" y1="250" x2="358" y2="240" stroke="#14171C" stroke-width="9" stroke-linecap="round" />
    <rect x="245" y="266" width="19" height="8" fill="#14171C" />

    <!-- left lens: pixel-stepped silhouette -->
    <rect x="192" y="242" width="40" height="8" fill="#14171C" />
    <rect x="184" y="250" width="56" height="8" fill="#14171C" />
    <rect x="176" y="258" width="16" height="8" fill="#14171C" />
    <rect x="192" y="258" width="8" height="8" fill="#FFFFFF" />
    <rect x="200" y="258" width="48" height="8" fill="#14171C" />
    <rect x="176" y="266" width="72" height="8" fill="#14171C" />
    <rect x="176" y="274" width="72" height="8" fill="#14171C" />
    <rect x="184" y="282" width="56" height="8" fill="#14171C" />
    <rect x="192" y="290" width="40" height="8" fill="#14171C" />

    <!-- right lens: mirrored pixel-stepped silhouette -->
    <rect x="280" y="242" width="40" height="8" fill="#14171C" />
    <rect x="272" y="250" width="56" height="8" fill="#14171C" />
    <rect x="264" y="258" width="48" height="8" fill="#14171C" />
    <rect x="312" y="258" width="8" height="8" fill="#FFFFFF" />
    <rect x="320" y="258" width="16" height="8" fill="#14171C" />
    <rect x="264" y="266" width="72" height="8" fill="#14171C" />
    <rect x="264" y="274" width="72" height="8" fill="#14171C" />
    <rect x="272" y="282" width="56" height="8" fill="#14171C" />
    <rect x="280" y="290" width="40" height="8" fill="#14171C" />

    <!-- snout: narrow, more muzzle-like -->
    <ellipse cx="256" cy="356" rx="64" ry="58" fill="#FBF6E9" />

    <!-- nose: dusty pink-brown, not black -->
    <ellipse cx="256" cy="322" rx="17" ry="12" fill="#B8806C" />
    <circle cx="250" cy="317" r="3.5" fill="#FFFFFF" opacity="0.6" />

    <!-- mouth -->
    <path d="M 256 336 L 256 348 Q 256 360 236 366 Q 218 370 210 358" stroke="#8A5A46" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 256 348 Q 256 360 276 366 Q 294 370 302 358" stroke="#8A5A46" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- tongue, hanging out -->
    <path d="M 244 362 Q 244 408 256 414 Q 268 408 268 362 Z" fill="#FA92A8" />
    <line x1="256" y1="368" x2="256" y2="402" stroke="#E4728A" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
